// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "return_to_slot_1"
alias class_slot_2_action "return_to_slot_2"
alias class_slot_3_action "return_to_slot_3"

alias return_to_slot_1 "slot1; alias return_action slot_1; set_delay_to_normal"
alias return_to_slot_2 "slot2; alias return_action previous_slot; set_delay_to_normal"
alias return_to_slot_3 "slot3; alias return_action slot_3; set_delay_to_custom; set_bypass_actions"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ========================================= //
//    Holster speed penalty bypass script    //
// ========================================= //

// 1. Bypass actions
alias bypass_to_slot_1 "slot2; wait 5; return_to_slot_1; reset_bypass_actions"
alias bypass_to_slot_2 "slot1; wait 5; return_to_slot_2; reset_bypass_actions"

// 2. Logic gates
alias set_bypass_actions_on  "alias class_slot_1_action bypass_to_slot_1; alias class_slot_2_action bypass_to_slot_2"
alias set_bypass_actions_off "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"
alias reset_bypass_actions   "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"

// 3. Holster speed penalty bypass mode toggle
alias bypass_mode_off "alias throw_preference normal_throw; alias set_bypass_actions set_bypass_actions_off; alias toggle_bypass_mode bypass_mode_on; play ui/buttonclick.wav; refresh_delay; reset_bypass_actions"
alias bypass_mode_on  "alias throw_preference bypass_throw; alias set_bypass_actions set_bypass_actions_on; alias toggle_bypass_mode bypass_mode_off; play ui/buttonclickrelease.wav; refresh_delay"
alias refresh_delay   "set_delay_to_custom"

// 4. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 5. Holster speed penalty bypass mode toggle actions
alias +bypass_mode_toggle_action "alias tap_guard none; alias hold_guard toggle_bypass_mode; wait 100; alias tap_guard none; hold_guard"
alias -bypass_mode_toggle_action "alias hold_guard none; tap_guard"

// 6. Initialization
bypass_mode_on

// 7. Key binds
bind "-" "+bypass_mode_toggle_action" // Tap: none / Hold: Toggle holster speed penalty bypass mode

// ======================================= //
//    Quick consume / throw food script    //
// ======================================= //

// 1. Throw types
alias normal_throw "slot2; +attack2; wait 100; -attack2; return_action"
alias bypass_throw "slot1; wait 5; slot2; +attack2; wait 100; -attack2; return_action"

// 2. Logic gates
alias throw_preference    "normal_throw"
alias set_delay_to_normal "alias current_throw_action normal_throw"
alias set_delay_to_custom "alias current_throw_action throw_preference"

// 3. Food actions
alias consume_food "slot2; wait 5; taunt; return_action"
alias throw_food   "current_throw_action"

// 4. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 5. Throw actions
alias +throw_action "alias tap_guard consume_food; alias hold_guard throw_food; wait 100; alias tap_guard none; hold_guard"
alias -throw_action "alias hold_guard none; tap_guard"

// 6. Initialization
set_delay_to_normal

// 7. Key binds
bind "mouse4" "+throw_action" // Tap: Consume food / Hold: Throw food