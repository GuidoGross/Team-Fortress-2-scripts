// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1"
alias class_slot_2_action "slot2; alias slot_1_return_action slot_2_return_action"
alias class_slot_3_action "slot3; alias slot_1_return_action slot_3_return_action"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_2; alias previous_slot slot_3" // Sets the slot to Slot Nº 2 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ========================================== //
//    Quick Crusaders Crossbow heal script    //
// ========================================== //

// 1. Crossbow dynamic return logic
alias slot_1_return_action "slot_2_return_action"
alias slot_2_return_action "slot_2; alias previous_slot slot_3"
alias slot_3_return_action "slot_3; alias previous_slot slot_2"

// 2. Quick Crusaders Crossbow heal
alias use_slot_1_mouse1 "class_slot_1_action; +attack; wait 100; -attack; slot_1_return_action"

// 3. Key bind
bind "mouse4" "use_slot_1_mouse1" // Quick Crusaders Crossbow heal

// ================== //
//    Radar script    //
// ================== //

// 1. Autocall thresholds
alias default_autocall "hud_medicautocallersthreshold 75"  // Default autocall threshold
alias autocall_all     "hud_medicautocallersthreshold 300" // High autocall threshold 

// 2. Radar logic
alias radar "autocall_all; play ui/buttonclick.wav; wait 250; default_autocall; play ui/buttonclickrelease.wav"

// =================================== //
//    ÜberCharge ready alert script    //
// =================================== //

// 1. ÜberCharge ready alert
alias ubercharge_ready_alert "say_team My ÜberCharge is ready!; voicemenu 1 7; ubercharge_alert_mode_off"

// 2. Mode toggle logic
alias ubercharge_alert_mode_on     "bind - ubercharge_ready_alert; alias toggle_ubercharge_alert_mode ubercharge_alert_mode_off; play ui/buttonclick.wav"
alias ubercharge_alert_mode_off    "bind - radar; alias toggle_ubercharge_alert_mode ubercharge_alert_mode_on; play ui/buttonclickrelease.wav"
alias toggle_ubercharge_alert_mode "ubercharge_alert_mode_on"

// 3. Initialization
ubercharge_alert_mode_off

// 4. Key binds
bind "shift" "toggle_ubercharge_alert_mode" // Toggle ÜberCharge ready alert mode