// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1; alias return_action slot_1"
alias class_slot_2_action "slot2; alias return_action slot_2"
alias class_slot_3_action "slot3; alias return_action slot_3"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ===================================================== //
//    Quick Flying Guillotine / Mad Milk throw script    //
// ===================================================== //

// 1. Use second slot mouse1
alias use_second_slot_mouse1 "slot2; +attack; wait 100; -attack; return_action"

// 2. Key bind
bind "mouse4" "use_second_slot_mouse1" // Flying Guillotine / Mad Milk throw

// ===================================================== //
//    Quick Wrap Assassin / Sandman ball throw script    //
// ===================================================== //

// 1. Use third slot mouse2
alias use_third_slot_mouse2 "slot3; +attack2; wait 100; -attack2; return_action"

// 2. Key bind
bind "-" "use_third_slot_mouse2" // Wrap Assassin / Sandman ball throw