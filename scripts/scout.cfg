// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1; alias return_action slot_1"
alias class_slot_2_action "slot2; alias return_action previous_slot"
alias class_slot_3_action "slot3; alias return_action slot_3"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ================================================================== //
//    Quick Flying Guillotine / Mad Milk throw / Soda drink script    //
// ================================================================== //

// 1. Throw/drink actions
alias use_slot_2_mouse1 "slot2; +attack; wait 100; -attack; return_action"
alias use_slot_2_taunt  "slot2; wait 5; taunt; return_action"

// 2. Logic gates
alias set_mouse4_action_on  "alias current_mouse4_action use_slot_2_taunt"
alias set_mouse4_action_off "alias current_mouse4_action use_slot_2_mouse1"

// 3. Soda mode toggle
alias soda_mode_off "alias set_mouse4_action set_mouse4_action_off; alias toggle_soda_mode soda_mode_on; play ui/buttonclick.wav; set_mouse4_action"
alias soda_mode_on  "alias set_mouse4_action set_mouse4_action_on; alias toggle_soda_mode soda_mode_off; play ui/buttonclickrelease.wav; set_mouse4_action"

// 4. Key bind
bind "mouse4" "current_mouse4_action" // Tap: Flying Guillotine / Mad Milk throw / Soda drink

// ======================================================================== //
//    Quick Wrap Assassin / Sandman ball throw / Soda mode toggle script    //
// ======================================================================== //

// 1. Quick Wrap Assassin / Sandman ball throw
alias use_slot_3_mouse2 "slot3; +attack2; wait 100; -attack2; return_action"

// 2. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 3. Soda mode toggle actions
alias +soda_mode_toggle_action "alias tap_guard use_slot_3_mouse2; alias hold_guard toggle_soda_mode; wait 100; alias tap_guard none; hold_guard"
alias -soda_mode_toggle_action "alias hold_guard none; tap_guard"

// 4. Initialization
soda_mode_off

// 5. Key bind
bind "-" "+soda_mode_toggle_action" // Tap: Wrap Assassin / Sandman ball throw / Hold: Toggle soda mode