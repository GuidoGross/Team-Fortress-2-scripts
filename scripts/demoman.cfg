// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1"
alias class_slot_2_action "slot2"
alias class_slot_3_action "slot3"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_2" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 2
set_previous_slot_cycle

// ========================== //
//    Sticky jump script      //
// ========================== //

// 1. Rocket jump actions
alias +sticky_jump "+jump_duck; +attack2"
alias -sticky_jump "-attack2; wait 25; -jump_duck"

// 6. Key bind
bind "mouse4" "+sticky_jump" // Sticky jump