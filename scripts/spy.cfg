// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot_1_action; alias refresh_actual_action set_action_to_auto_disguise; alias refresh_yer_action set_action_to_normal_attack"
alias class_slot_2_action "slot_2_action; alias refresh_actual_action set_action_to_normal_attack; alias refresh_yer_action set_action_to_normal_attack"
alias class_slot_3_action "slot_3_action; alias refresh_actual_action set_action_to_auto_disguise; alias refresh_yer_action set_action_to_normal_attack"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_3; alias previous_slot slot_1" // Sets the slot to Slot Nº 3 and the previous slot to Slot Nº 1
set_previous_slot_cycle

// 2. First disguise
alias set_first_disguise "disguise 8 -1" // Sets the first disguise as an enemy Spy
set_first_disguise

// 3. First disguise slot
alias set_first_disguise_slot "wait 375; slot_3; use_previous_disguise" // Sets the first disguise slot to Slot Nº 3
set_first_disguise_slot

// 4. Following disguises
alias following_disguises "alias following_disguises use_previous_disguise" // Uses the previous disguise after the first time

// ================= //
//    Basic binds    //
// ================= //

// 1. Use previous disguise
alias use_previous_disguise "lastdisguise"

// 2. Key bind
bind "mouse4" "use_previous_disguise" // Previous disguise

// ========================== //
//    Auto-disguise script    //
// ========================== //

// 1. Attack types
alias +auto_disguise "+attack"
alias -auto_disguise "-attack; use_previous_disguise"

alias +normal_attack "+attack"
alias -normal_attack "-attack"

alias set_action_to_auto_disguise "alias +left_click +auto_disguise; alias -left_click -auto_disguise"
alias set_action_to_normal_attack "alias +left_click +normal_attack; alias -left_click -normal_attack"

// 2. Modes

// 2.1. Normal mode
alias slot_1_auto_disguise_mode "slot1; set_action_to_auto_disguise"
alias slot_2_auto_disguise_mode "slot2; set_action_to_normal_attack"
alias slot_3_auto_disguise_mode "slot3; set_action_to_auto_disguise"
alias slot_4_auto_disguise_mode "slot4" // The Disguise kit doesnt require to trigger any action

// 2.2. Your Eternal Reward mode
alias slot_1_yer_mode "slot1; set_action_to_normal_attack"
alias slot_2_yer_mode "slot2; set_action_to_normal_attack"
alias slot_3_yer_mode "slot3; set_action_to_normal_attack"
alias slot_4_yer_mode "slot4" // The Disguise kit doesnt require to trigger any action

// 3. Initial values
alias refresh_actual_action "set_action_to_auto_disguise"
alias refresh_yer_action    "set_action_to_normal_attack"
set_action_to_auto_disguise

// 4. Mode switch
alias auto_disguise_mode "alias slot_1_action slot_1_auto_disguise_mode; alias slot_2_action slot_2_auto_disguise_mode; alias slot_3_action slot_3_auto_disguise_mode; alias slot_4_action slot_4_auto_disguise_mode; alias switch_modes yer_mode; refresh_actual_action; following_disguises; play ui/buttonclick.wav"
alias yer_mode           "alias slot_1_action slot_1_yer_mode; alias slot_2_action slot_2_yer_mode; alias slot_3_action slot_3_yer_mode; alias slot_4_action slot_4_yer_mode; alias switch_modes auto_disguise_mode; refresh_yer_action; play ui/buttonclick.wav"

// 5. Key binds
bind "mouse1" "+left_click"   // Primary attack
bind "3"      "slot_4_action" // Slot Nº 4
bind "-"      "switch_modes"  // Switch modes

// 6. Final Initialization
auto_disguise_mode