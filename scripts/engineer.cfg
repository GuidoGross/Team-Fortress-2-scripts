// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1; alias return_action slot_1; set_sentry_jump_to_delayed"
alias class_slot_2_action "slot2; set_sentry_jump_to_instant"
alias class_slot_3_action "slot3; alias return_action slot_3; set_sentry_jump_to_delayed"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_3; alias previous_slot slot_1"
set_previous_slot_cycle

// ================================== //
//    Quick build / destroy script    //
// ================================== //

// 1. Build logic
alias build_sentry            "build 2 0"
alias build_dispenser         "build 0 0"
alias build_teleport_entrance "build 1 0"
alias build_teleport_exit     "build 1 1"

// 2. Destroy logic
alias destroy_sentry            "destroy 2 0"
alias destroy_dispenser         "destroy 0 0"
alias destroy_teleport_entrance "destroy 1 0"
alias destroy_teleport_exit     "destroy 1 1"
alias destroy_all               "destroy_sentry; wait 50; destroy_dispenser; wait 50; destroy_teleport_entrance; wait 50; destroy_teleport_exit"

// 3. Build/destroy actions

// 3.1. Sentry
alias +sentry_action "alias tap_guard build_sentry; alias hold_guard destroy_sentry; wait 100; alias tap_guard none; hold_guard"
alias -sentry_action "alias hold_guard none; tap_guard"

// 3.2. Dispenser
alias +dispenser_action "alias tap_guard build_dispenser; alias hold_guard destroy_dispenser; wait 100; alias tap_guard none; hold_guard"
alias -dispenser_action "alias hold_guard none; tap_guard"

// 3.3. Teleporter Entrance
alias +entrance_action "alias tap_guard build_teleport_entrance; alias hold_guard destroy_teleport_entrance; wait 100; alias tap_guard none; hold_guard"
alias -entrance_action "alias hold_guard none; tap_guard"

// 3.4. Teleporter Exit
alias +exit_action "alias tap_guard build_teleport_exit; alias hold_guard destroy_teleport_exit; wait 100; alias tap_guard none; hold_guard"
alias -exit_action "alias hold_guard none; tap_guard"

// 3.5. Destroy All
alias +destroy_all_action "alias tap_guard none; alias hold_guard destroy_all; wait 100; alias tap_guard none; hold_guard"
alias -destroy_all_action "alias hold_guard none; tap_guard"

// 4. Key Binds
bind "-" "+sentry_action"      // Tap: Sentry / Hold: Destroy Sentry
bind "v" "+dispenser_action"   // Tap: Dispenser / Hold: Destroy Dispenser
bind "x" "+entrance_action"    // Tap: Teleporter Entrance / Hold: Destroy Teleporter Entrance
bind "c" "+exit_action"        // Tap: Teleporter Exit / Hold: Destroy Teleporter Exit
bind "z" "+destroy_all_action" // Hold: Destroy all

// ========================================= //
//    Quick Eureka Effect teleport script    //
// ========================================= //

// 1. Teleport types
alias eureka_spawn "slot3; eureka_teleport 0"
alias eureka_exit  "slot3; eureka_teleport 1"

// 2. Eureka Effect actions
alias +eureka_action "alias tap_guard eureka_spawn; alias hold_guard eureka_exit; wait 100; alias tap_guard none; hold_guard"
alias -eureka_action "alias hold_guard none; tap_guard"

// 3. Key Bind
bind "r" "+eureka_action" // Tap: Teleport to spawn / Hold: Teleport to Teleporter Exit

// ===================================================================== //
//    Quick Short Circuit energy ball / Wrangler shield/rocket script    //
// ===================================================================== //

// 1. Use second slot secondary attack
alias use_second_slot_mouse2 "slot2; +attack2; wait 100; -attack2; return_action"

// 2. Default mouse4 behavior
alias +mouse4_default "use_second_slot_mouse2"
alias -mouse4_default "none"

// 3. Key bind
bind "mouse4" "+mouse4_default" // Short Circuit energy ball / Wrangler shield/rocket

// ======================== //
//    Sentry jump script    //
// ======================== //

// 1. Sentry jump actions
alias stop_sentry_jump    "-attack2; -jump_duck"
alias instant_sentry_jump "+jump_duck; +attack2; wait 25; stop_sentry_jump; sentry_jump_mode_off"
alias delayed_sentry_jump "slot2; wait 75; +jump_duck; +attack2; wait 25; stop_sentry_jump; return_action; sentry_jump_mode_off"

// 2. State setters
alias set_sentry_jump_to_instant "alias sentry_jump_logic instant_sentry_jump"
alias set_sentry_jump_to_delayed "alias sentry_jump_logic delayed_sentry_jump"

// 3. Mode toggle logic
alias sentry_jump_mode_on  "bind mouse4 sentry_jump_logic; alias toggle_sentry_jump sentry_jump_mode_off; play ui/buttonclick.wav"
alias sentry_jump_mode_off "bind mouse4 +mouse4_default; alias toggle_sentry_jump sentry_jump_mode_on; play ui/buttonclickrelease.wav"
alias toggle_sentry_jump "sentry_jump_mode_on"

// 4. Shift logic
alias shift_tap  "toggle_sentry_jump"
alias shift_hold "none"

alias +shift_action "alias shift_tap toggle_sentry_jump; alias shift_hold none; wait 100; alias shift_tap none; shift_hold"
alias -shift_action "alias shift_hold none; shift_tap"

// 5. Final Initialization
set_sentry_jump_to_delayed

// 6. Key Bind
bind "shift" "+shift_action" // Toggle sentry jump mode