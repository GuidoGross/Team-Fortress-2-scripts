// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "return_to_slot_1"
alias class_slot_2_action "return_to_slot_2"
alias class_slot_3_action "return_to_slot_3"

alias return_to_slot_1 "slot1; alias return_action slot_1; set_rocket_jump_to_instant"
alias return_to_slot_2 "slot2; alias return_action slot_2; set_rocket_jump_to_delayed"
alias return_to_slot_3 "slot3; alias return_action slot_3; set_rocket_jump_to_delayed; set_bypass_actions"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ======================================================== //
//    Quick banner / Holster speed penalty bypass script    //
// ======================================================== //

// 1. Banner action
alias use_banner "slot2; +attack; wait 100; -attack; return_action"

// 2. Bypass actions
alias bypass_to_slot_1 "slot2; wait 5; return_to_slot_1; reset_bypass_actions"
alias bypass_to_slot_2 "slot1; wait 5; return_to_slot_2; reset_bypass_actions"

// 3. Logic gates
alias set_bypass_actions_on  "alias class_slot_1_action bypass_to_slot_1; alias class_slot_2_action bypass_to_slot_2"
alias set_bypass_actions_off "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"
alias reset_bypass_actions   "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"

// 4. Holster speed penalty bypass mode toggle
alias bypass_mode_off "alias set_bypass_actions set_bypass_actions_off; alias toggle_bypass_mode bypass_mode_on; play ui/buttonclick.wav; reset_bypass_actions"
alias bypass_mode_on  "alias set_bypass_actions set_bypass_actions_on; alias toggle_bypass_mode bypass_mode_off; play ui/buttonclickrelease.wav"

// 5. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 6. Holster speed penalty bypass mode toggle actions
alias +bypass_mode_toggle_action "alias tap_guard use_banner; alias hold_guard toggle_bypass_mode; wait 100; alias tap_guard none; hold_guard"
alias -bypass_mode_toggle_action "alias hold_guard none; tap_guard"

// 7. Initialization
bypass_mode_off

// 8. Key binds
bind "-" "+bypass_mode_toggle_action" // Tap: Use banner / Hold: Toggle holster speed penalty bypass mode

// ========================== //
//    Rocket jump script      //
// ========================== //

// 1. Rocket jump actions
alias stop_rocket_jump    "wait 25; -attack; -jump_duck"
alias instant_rocket_jump "+jump_duck; +attack; stop_rocket_jump"
alias delayed_rocket_jump "slot_1; wait 90; +jump_duck; +attack; stop_rocket_jump"

// 4. State setters
alias set_rocket_jump_to_instant "alias rocket_jump instant_rocket_jump; alias rocket_jump instant_rocket_jump"
alias set_rocket_jump_to_delayed "alias rocket_jump delayed_rocket_jump; alias rocket_jump delayed_rocket_jump"

// 5. Initialization
set_rocket_jump_to_instant

// 6. Key binds
bind "mouse4" "rocket_jump" // Rocket jump