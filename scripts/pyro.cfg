// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "return_to_slot_1"
alias class_slot_2_action "return_to_slot_2"
alias class_slot_3_action "return_to_slot_3"

alias return_to_slot_1 "slot1; alias return_action slot_1; set_flare_jump_to_delayed"
alias return_to_slot_2 "slot2; set_flare_jump_to_instant"
alias return_to_slot_3 "slot3; alias return_action slot_3; set_flare_jump_to_delayed; set_bypass_actions"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// ============================================================== //
//    Quick melee attack / Holster speed penalty bypass script    //
// ============================================================== //

// 1. Quick melee attack
alias use_slot_3_mouse1 "slot3; set_bypass_actions; +attack; wait 145; -attack; return_action"

// 2. Bypass actions
alias bypass_to_slot_1 "slot2; wait 5; return_to_slot_1; reset_bypass_actions"
alias bypass_to_slot_2 "slot1; wait 5; return_to_slot_2; reset_bypass_actions"

// 3. Logic gates
alias set_bypass_actions_on  "alias class_slot_1_action bypass_to_slot_1; alias class_slot_2_action bypass_to_slot_2"
alias set_bypass_actions_off "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"
alias reset_bypass_actions   "alias class_slot_1_action return_to_slot_1; alias class_slot_2_action return_to_slot_2"

// 4. Holster speed penalty bypass mode toggle
alias bypass_mode_off "alias set_bypass_actions set_bypass_actions_off; alias toggle_bypass_mode bypass_mode_on; play ui/buttonclick.wav; reset_bypass_actions"
alias bypass_mode_on  "alias set_bypass_actions set_bypass_actions_on; alias toggle_bypass_mode bypass_mode_off; play ui/buttonclickrelease.wav"

// 5. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 6. Holster speed penalty bypass mode toggle actions
alias +bypass_mode_toggle_action "alias tap_guard use_slot_3_mouse1; alias hold_guard toggle_bypass_mode; wait 100; alias tap_guard none; hold_guard"
alias -bypass_mode_toggle_action "alias hold_guard none; tap_guard"

// 7. Initialization
bypass_mode_off

// 8. Key binds
bind "-" "+bypass_mode_toggle_action" // Tap: Quick melee attack / Hold: Toggle holster speed penalty bypass mode

// ====================================================== //
//    Quick Flare Gun attack / Thermal Thruster script    //
// ====================================================== //

// 1. Slot Nº 2 normal actions
alias use_slot_2_mouse1 "slot2; +attack; wait 100; -attack; return_action"
alias use_thermal_thruster   "slot2; wait 125; +jump; wait 50; -jump; +attack; wait 160; -attack; return_action"

// 2. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 3. Slot Nº 2 actions
alias +slot_2_action "alias tap_guard use_slot_2_mouse1; alias hold_guard use_thermal_thruster; wait 100; alias tap_guard none; hold_guard"
alias -slot_2_action "alias hold_guard none; tap_guard"

// 4. Key bind
bind "mouse4" "+slot_2_action" // Tap: Flare Gun attack / Hold: Thermal Thruster

// ======================= //
//    Flare jump script    //
// ======================= //

// 1. Flare jump actions
alias stop_flare_jump    "-attack; -jump_duck"
alias instant_flare_jump "+jump_duck; +attack; wait 25; stop_flare_jump; flare_jump_mode_off"
alias delayed_flare_jump "slot2; wait 75; +jump_duck; +attack; wait 25; stop_flare_jump; return_action; flare_jump_mode_off"

// 2. State setters
alias set_flare_jump_to_instant "alias flare_jump_logic instant_flare_jump"
alias set_flare_jump_to_delayed "alias flare_jump_logic delayed_flare_jump"

// 3. Mode toggle logic
alias flare_jump_mode_on  "bind mouse4 flare_jump_logic; alias toggle_flare_jump flare_jump_mode_off; play ui/buttonclick.wav"
alias flare_jump_mode_off "bind mouse4 +slot_2_action; alias toggle_flare_jump flare_jump_mode_on; play ui/buttonclickrelease.wav"
alias toggle_flare_jump   "flare_jump_mode_on"

// 4. Shift logic
alias shift_tap  "toggle_flare_jump"
alias shift_hold "none"

alias +shift_action "alias shift_tap toggle_flare_jump; alias shift_hold none; wait 100; alias shift_tap none; shift_hold"
alias -shift_action "alias shift_hold none; shift_tap"

// 6. Initialization
set_flare_jump_to_delayed

// 5. Key binds
bind "shift" "+shift_action" // Flare jump toggle