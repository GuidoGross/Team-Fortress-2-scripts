// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Global slot tracker injection
alias class_slot_1_action "slot1; alias return_action slot_1; set_flare_jump_to_delayed"
alias class_slot_2_action "slot2; set_flare_jump_to_instant"
alias class_slot_3_action "slot3; alias return_action slot_3; set_flare_jump_to_delayed"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3"
set_previous_slot_cycle

// =============================== //
//    Quick melee attack script    //
// =============================== //

// 1. Use third slot primary attack
alias use_third_slot_mouse1 "slot3; +attack; wait 130; -attack; return_action"

// 2. Key bind
bind "-" "use_third_slot_mouse1" // Melee attack

// ====================================================== //
//    Quick Flare Gun attack / Thermal Thruster script    //
// ====================================================== //

// 1. Slot 2 normal actions
alias use_second_slot_mouse1 "slot2; +attack; wait 100; -attack; return_action"
alias use_thermal_thruster   "slot2; wait 125; +jump; wait 50; -jump; +attack; wait 160; -attack; return_action"

// 2. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 3. Second slot actions
alias +second_slot_action "alias tap_guard use_second_slot_mouse1; alias hold_guard use_thermal_thruster; wait 100; alias tap_guard none; hold_guard"
alias -second_slot_action "alias hold_guard none; tap_guard"

// 4. Key bind
bind "mouse4" "+second_slot_action" // Tap: Flare Gun attack / Hold: Thermal Thruster

// ======================= //
//    Flare jump script    //
// ======================= //

// 1. Flare jump actions
alias stop_flare_jump    "-attack; -jump_duck"
alias instant_flare_jump "+jump_duck; +attack; wait 25; stop_flare_jump; flare_jump_mode_off"
alias delayed_flare_jump "slot2; wait 75; +jump_duck; +attack; wait 25; stop_flare_jump; return_action; flare_jump_mode_off"

// 2. State setters
alias set_flare_jump_to_instant "alias flare_jump_logic instant_flare_jump"
alias set_flare_jump_to_delayed "alias flare_jump_logic delayed_flare_jump"

// 3. Mode toggle logic
alias flare_jump_mode_on  "bind mouse4 flare_jump_logic; alias toggle_flare_jump flare_jump_mode_off; play ui/buttonclick.wav"
alias flare_jump_mode_off "bind mouse4 +second_slot_action; alias toggle_flare_jump flare_jump_mode_on; play ui/buttonclickrelease.wav"
alias toggle_flare_jump   "flare_jump_mode_on"

// 4. Shift logic
alias shift_tap  "toggle_flare_jump"
alias shift_hold "none"

alias +shift_action "alias shift_tap toggle_flare_jump; alias shift_hold none; wait 100; alias shift_tap none; shift_hold"
alias -shift_action "alias shift_hold none; shift_tap"

// 6. Initialization
set_flare_jump_to_delayed

// 5. Key bind
bind "shift"  "+shift_action" // Flare jump toggle