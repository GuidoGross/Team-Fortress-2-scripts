// =================================== //
//    Null-cancelling strafe script    //
// =================================== //

// 1. Strafing logic
alias +move_forward "-back; +forward; alias check_forward +forward;"
alias +move_back    "-forward; +back; alias check_back +back;"
alias +move_left    "-moveright; +moveleft; alias check_left +moveleft;"
alias +move_right   "-moveleft; +moveright; alias check_right +moveright;"
alias -move_forward "-forward; check_back; alias check_forward none"
alias -move_back    "-back; check_forward; alias check_back none"
alias -move_left    "-moveleft; check_right; alias check_left none"
alias -move_right   "-moveright; check_left; alias check_right none"
alias check_forward "none"
alias check_back    "none"
alias check_left    "none"
alias check_right   "none"
alias none          ""

// 2. Key binds
bind "w" "+move_forward" // Move forward
bind "s" "+move_back"    // Move back
bind "a" "+move_left"    // Move left
bind "d" "+move_right"   // Move right

// ====================== //
//    Jump duck script    //
// ====================== //

// 1. Class modifier
alias jump_duck_class_modifier ""

// 2. Jump duck action
alias +jump_duck "+jump; +duck; jump_duck_class_modifier"
alias -jump_duck "-jump; -duck"

// 3. Key bind
bind "space" "+jump_duck" // Jump duck

// ========================= //
//    Slot tracker script    //
// ========================= //

// 1. Reset class modifiers
alias reset_class_modifiers "alias class_slot_1_action slot1; alias class_slot_2_action slot2; alias class_slot_3_action slot3; alias jump_duck_class_modifier ""; bind mouse1 +attack; bind mouse2 +attack2" // Resets class modifiers (call this at the start of every class .cfg file)

// 2. Base slot actions
alias slot_1 "class_slot_1_action; alias previous_slot previous_slot_for_slot_1; set_previous_slot_to_1"
alias slot_2 "class_slot_2_action; alias previous_slot previous_slot_for_slot_2; set_previous_slot_to_2"
alias slot_3 "class_slot_3_action; alias previous_slot previous_slot_for_slot_3; set_previous_slot_to_3"

// 3. Previous slot matrix
alias set_previous_slot_to_1 "alias previous_slot_for_slot_2 slot_1; alias previous_slot_for_slot_3 slot_1"
alias set_previous_slot_to_2 "alias previous_slot_for_slot_1 slot_2; alias previous_slot_for_slot_3 slot_2"
alias set_previous_slot_to_3 "alias previous_slot_for_slot_1 slot_3; alias previous_slot_for_slot_2 slot_3"

// 4. Initial default tracking values
alias previous_slot_for_slot_1 "slot_3"
alias previous_slot_for_slot_2 "slot_1"
alias previous_slot_for_slot_3 "slot_1"
alias previous_slot            "slot_3"

// 5. Key binds
bind "1"      "slot_1"        // Slot Nº 1
bind "2"      "slot_2"        // Slot Nº 2
bind "mouse5" "slot_3"        // Slot Nº 3
bind "q"      "previous_slot" // Previous slot

// 6. Final initialization
reset_class_modifiers

// ====================================== //
//    Medic request / Spy alert script    //
// ====================================== //

// 1. Voice commands
alias medic_request "voicemenu 0 0" // Medic request
alias spy_alert     "voicemenu 1 1" // Spy alert

// 2. Tap and hold logic
alias tap_guard  "none"
alias hold_guard "none"

// 3. Message actions
alias +message_action "alias tap_guard medic_request; alias hold_guard spy_alert; wait 100; alias tap_guard none; hold_guard"
alias -message_action "alias hold_guard none; tap_guard"

// 4. Key bind
bind "e" "+message_action" // Tap: Medic request / Hold: Spy alert