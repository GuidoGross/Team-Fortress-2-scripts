// ===================== //
//    Class modifiers    //
// ===================== //

// 1. Reset slot tracker and class modifiers
reset_class_modifiers

// 2. Jump duck script
alias jump_duck_class_modifier "automatic_zoom_tracker_reset"

// 3. Global slot tracker injection
alias class_slot_1_action "slot1; set_action_to_quickscope"
alias class_slot_2_action "slot2; set_action_to_normal_attack"
alias class_slot_3_action "slot3; set_action_to_normal_attack"

// ==================== //
//    Initial script    //
// ==================== //

// 1. Initial previous slot cycle
alias set_previous_slot_cycle "slot_1; alias previous_slot slot_3" // Sets the slot to Slot Nº 1 and the previous slot to Slot Nº 3
set_previous_slot_cycle

// =============================== //
//    Quick Jarate throw script    //
// =============================== //

// 1. Use second slot primary attack
alias use_second_slot_mouse1 "slot_2; +attack; wait 100; -attack; previous_slot"

// 2. Key bind
bind "mouse4" "use_second_slot_mouse1" // Use second slot primary attack

// ======================== //
//    Quick scope script    //
// ======================== //

// 1. Attack types
alias +normal_attack "+attack"
alias -normal_attack "-attack; unzoom"

alias quick_scope_action "+attack2; +attack; wait 25; -attack; -attack2; unzoom"
alias +quick_scope       "quick_scope_action"
alias -quick_scope       ""

alias +default_attack "+attack"
alias -default_attack "-attack"

alias +default_zoom "+attack2"
alias -default_zoom "-attack2"

// 2. Action setters
alias set_action_to_quickscope "alias +left_click +current_attack; alias -left_click -current_attack; alias +right_click +zoom_action; alias -right_click -zoom_action"
alias set_action_to_normal     "alias +left_click +default_attack; alias -left_click -default_attack; alias +right_click +default_zoom; alias -right_click -default_zoom; automatic_zoom_tracker_reset"

// 3. Zoom tracker logic

// 3.1. Zoom actions
alias zoom   "alias +current_attack +normal_attack; alias -current_attack -normal_attack; alias +zoom_action +trigger_unzoom; alias -zoom_action -trigger_unzoom"
alias unzoom "alias +current_attack +quick_scope; alias -current_attack -quick_scope; alias +zoom_action +trigger_zoom; alias -zoom_action -trigger_zoom"

// 3.2. Mouse 2 triggers
alias +trigger_zoom "+attack2; zoom"
alias -trigger_zoom "-attack2"

alias +trigger_unzoom "+attack2; unzoom"
alias -trigger_unzoom "-attack2"

// 7. Reset zoom tracker
alias automatic_zoom_tracker_reset "-attack; -attack2; unzoom"
alias manual_zoom_tracker_reset "automatic_zoom_tracker_reset; play ui/buttonclick.wav"

// 8. Key binds
bind "mouse1" "+left_click"               // Primary attack
bind "mouse2" "+right_click"              // Zoom action
bind "-"      "manual_zoom_tracker_reset" // Reset zoom tracker manually

// 9. Final Initialization
unzoom
set_action_to_quickscope